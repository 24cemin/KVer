syntax = "proto3";

package raft;

option go_package = "github.com/emin/kver/proto/raft/gen;raftpb";

// ─── Log Entry ───────────────────────────────────────────────────────────────

message LogEntry {
  uint64 index    = 1;
  uint64 term     = 2;
  bytes  command  = 3;  // marshalled KV command
  EntryType type  = 4;
}

enum EntryType {
  ENTRY_KV         = 0;
  ENTRY_MEMBERSHIP = 1;
  ENTRY_NOOP       = 2;
}

// ─── RequestVote ─────────────────────────────────────────────────────────────

message RequestVoteRequest {
  uint64 term           = 1;
  string candidate_id   = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term  = 4;
  bool   pre_vote       = 5;
}

message RequestVoteResponse {
  uint64 term         = 1;
  bool   vote_granted = 2;
}

// ─── AppendEntries ───────────────────────────────────────────────────────────

message AppendEntriesRequest {
  uint64         term           = 1;
  string         leader_id      = 2;
  uint64         prev_log_index = 3;
  uint64         prev_log_term  = 4;
  repeated LogEntry entries     = 5;
  uint64         leader_commit  = 6;
}

message AppendEntriesResponse {
  uint64 term    = 1;
  bool   success = 2;
  // Hızlı geri çekilme için optimizasyon (§5.3)
  uint64 conflict_index = 3;
  uint64 conflict_term  = 4;
}

// ─── InstallSnapshot ─────────────────────────────────────────────────────────

message InstallSnapshotRequest {
  uint64 term                = 1;
  string leader_id           = 2;
  uint64 last_included_index = 3;
  uint64 last_included_term  = 4;
  bytes  data                = 5;
}

message InstallSnapshotResponse {
  uint64 term = 1;
}

// ─── Raft Internal RPC Service ───────────────────────────────────────────────

service RaftService {
  rpc RequestVote    (RequestVoteRequest)    returns (RequestVoteResponse);
  rpc AppendEntries  (AppendEntriesRequest)  returns (AppendEntriesResponse);
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
}

// ─── WAL Messages ───

// LogEntries represents a collection of log entries, used for saving WAL to disk.
message LogEntries {
  repeated LogEntry entries = 1;
}
