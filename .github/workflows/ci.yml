name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Lint ──────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: true

      - name: Check go mod tidy
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "❌ go.mod or go.sum is not tidy!"
            echo "Run 'go mod tidy' and commit the changes."
            git diff go.mod go.sum
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.0
          args: --config=.golangci.yml

  # ─── Unit Test ─────────────────────────────────────────────────────────────────
  unit-test:
    name: Unit Test (Go 1.24)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: true

      - name: Run unit tests with coverage
        run: go test -race -count=1 -coverprofile=coverage.out ./internal/...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage.out

  # ─── Build ─────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Build all packages
        run: go build ./...

      - name: Build binaries
        run: |
          go build -o /dev/null ./cmd/server
          go build -o /dev/null ./cmd/kvctl

  # ─── Proto Freshness Check ────────────────────────────────────────────────────
  proto-check:
    name: Proto Freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: true

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.1"

      - name: Install Go protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.34.1
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.3.0

      - name: Regenerate proto files
        run: bash scripts/gen_proto.sh

      - name: Verify proto files are up-to-date
        run: |
          if ! git diff --quiet proto/; then
            echo "❌ Generated proto files are stale!"
            echo "Run 'make proto' and commit the results."
            git diff proto/
            exit 1
          fi

  # ─── Integration Test ─────────────────────────────────────────────────────────
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, unit-test, build, proto-check]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: true

      - name: Run integration tests
        run: go test -race -count=1 -timeout 5m -v ./tests/integration/...

  # ─── Automated E2E Test ───────────────────────────────────────────────────────
  e2e-test:
    name: Automated E2E Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, unit-test, build, proto-check]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: true

      # Go benchmarks are compiled as part of this command but are not executed.
      - name: Run automated E2E tests
        run: go test -race -count=1 -timeout 5m -v ./tests/e2e/...
